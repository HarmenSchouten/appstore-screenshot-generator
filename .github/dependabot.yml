version: 2
updates:
  # npm version updates are off (#150): Dependabot can't regenerate deno.lock,
  # so the update-deps workflow opens the weekly in-range update PR instead.
  # A limit of 0 stops version updates only; security updates still arrive as
  # PRs that edit package.json, and need `deno install` and a committed
  # deno.lock before merging (see CONTRIBUTING.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase
    # Deferred majors, each a source migration tracked in its own issue.
    # Remove the entry when that issue is done.
    ignore:
      - dependency-name: react # #97
        update-types: [version-update:semver-major]
      - dependency-name: react-dom # #97
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react" # #97
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom" # #97
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss # #98
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
