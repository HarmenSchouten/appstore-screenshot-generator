name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      # Deno owns node_modules and deno.lock (package.json is the npm manifest,
      # deno.lock the only lockfile). --frozen fails the build if deno.lock is
      # out of date, so a manifest change without a lock update can't slip in.
      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: deno install --frozen

      # Dependabot edits package.json but cannot regenerate deno.lock, so let
      # its PRs resolve fresh; the lock is refreshed locally before merging
      # (see CONTRIBUTING.md).
      - name: Install dependencies (Dependabot PR)
        if: github.actor == 'dependabot[bot]'
        run: deno install

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Build UI
        run: deno task build
